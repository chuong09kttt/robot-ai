<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🐹 CHIRI - Trợ lý AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        /* Robot Face */
        .robot-section { text-align: center; margin: 10px 0; }
        .robot-avatar {
            width: 260px; height: 260px; margin: 0 auto;
            background: radial-gradient(circle at 35% 35%, #f0f4ff, #cbd5e1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }
        .robot-face { position: relative; width: 170px; height: 170px; }
        .eyes { display: flex; justify-content: space-between; gap: 50px; margin-bottom: 35px; }
        .eye {
            width: 44px; height: 44px; background: #1e293b; border-radius: 50%;
            transition: 0.1s; position: relative;
        }
        .eye::after { content: ''; position: absolute; width: 17px; height: 17px; background: white; border-radius: 50%; top: 8px; left: 8px; }
        .mouth {
            width: 95px; height: 48px; background: #1e293b; margin: 0 auto;
            border-radius: 0 0 48px 48px; transition: 0.1s;
        }
        /* Animations */
        .listening .eye { animation: pulseRed 0.6s infinite; background: #dc2626; }
        .speaking .mouth { animation: talkAnim 0.12s infinite; background: #10b981; }
        .thinking .eye { animation: thinkMove 0.8s infinite; }
        @keyframes talkAnim { 0%,100% { height: 25px; } 50% { height: 60px; } }
        @keyframes pulseRed { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); background: #ef4444; } }
        @keyframes thinkMove { 0%,100% { transform: translateX(0); } 50% { transform: translateX(15px); } }
        
        .robot-name { font-size: 34px; font-weight: 800; color: white; margin-top: 16px; text-shadow: 0 2px 5px black; }
        .status-text { font-size: 14px; background: rgba(0,0,0,0.6); display: inline-block; padding: 8px 20px; border-radius: 40px; margin-top: 12px; color: #e2e8f0; }
        
        /* Chat box */
        .chat-box {
            background: rgba(0,0,0,0.4); border-radius: 28px; padding: 14px;
            height: 140px; overflow-y: auto; margin: 20px 0; font-size: 13px;
        }
        .msg-user { text-align: right; margin-bottom: 8px; }
        .msg-user span { background: #3b82f6; padding: 8px 16px; border-radius: 24px; display: inline-block; color: white; max-width: 80%; }
        .msg-ai { text-align: left; margin-bottom: 8px; }
        .msg-ai span { background: rgba(255,255,255,0.9); padding: 8px 16px; border-radius: 24px; color: #1f2937; display: inline-block; max-width: 80%; }
        
        .tip { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 8px; }
        
        /* Nút bắt đầu */
        .start-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            padding: 16px 32px;
            border-radius: 60px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            margin: 10px auto;
            width: 80%;
            transition: 0.2s;
            border: none;
        }
        .start-btn:active { transform: scale(0.96); }
        .hidden { display: none; }
        
        /* Manual wake button nhỏ cho iOS */
        .ios-wake {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 30px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
        }
        .ios-wake.show { display: block; }
        .ios-wake:active { transform: scale(0.95); }
    </style>
</head>
<body>
<div class="container">
    <div class="robot-section">
        <div class="robot-avatar" id="robotAvatar">
            <div class="robot-face" id="robotFace">
                <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mouth"></div>
            </div>
        </div>
        <div class="robot-name">🐹 CHIRI</div>
        <div class="status-text" id="statusText">🎤 Cần cấp quyền Micro</div>
    </div>

    <button class="start-btn" id="startMicroBtn">🎙️ CHO PHÉP MICRO & BẮT ĐẦU</button>

    <div class="chat-box" id="chatBox">
        <div class="msg-ai"><span>🐹 Chào bạn! Hãy nhấn nút bên trên để cấp quyền micro.</span></div>
    </div>
    <div class="tip">💡 Sau khi cấp quyền, CHIRI sẽ luôn lắng nghe. Nói "CHIRI ơi" hoặc trực tiếp câu hỏi.</div>
</div>

<!-- Nút hỗ trợ iOS (hiện ra khi micro bị ngắt) -->
<div class="ios-wake" id="iosWakeBtn">🔴 Bấm để kích hoạt lại micro</div>

<script>
    // ==================== KHỞI TẠO ====================
    let ws = null;
    let isProcessing = false;
    let currentAudio = null;
    let mediaStream = null;
    let recognition = null;
    let isAwake = true;
    let inactivityTimer = null;
    let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const INACTIVITY_LIMIT = 120000;

    const robotFace = document.getElementById('robotFace');
    const statusDiv = document.getElementById('statusText');
    const chatBox = document.getElementById('chatBox');
    const startBtn = document.getElementById('startMicroBtn');
    const iosWakeBtn = document.getElementById('iosWakeBtn');

    function addMessage(type, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = type === 'user' ? 'msg-user' : 'msg-ai';
        msgDiv.innerHTML = `<span>${type === 'user' ? '👤 ' : '🐹 '}${text}</span>`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        if(chatBox.children.length > 15) chatBox.removeChild(chatBox.firstChild);
    }

    // WebSocket
    function connectWS() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}`);
        ws.onopen = () => console.log("✅ WS Connected");
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if(data.type === 'ai') {
                robotFace.classList.remove('thinking');
                addMessage('ai', data.text);
                speakText(data.text);
                resetInactivityTimer();
            }
        };
        ws.onclose = () => setTimeout(connectWS, 2000);
    }

    // TTS
    async function speakText(text) {
        if(currentAudio) { currentAudio.pause(); currentAudio = null; }
        robotFace.classList.add('speaking');
        try {
            const res = await fetch(`/tts?text=${encodeURIComponent(text)}`);
            if(res.ok) {
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                currentAudio = new Audio(url);
                currentAudio.onended = () => {
                    robotFace.classList.remove('speaking');
                    URL.revokeObjectURL(url);
                    currentAudio = null;
                    isProcessing = false;
                };
                currentAudio.onerror = () => fallbackSpeech(text);
                await currentAudio.play();
                return;
            }
        } catch(e) {}
        fallbackSpeech(text);
    }

    function fallbackSpeech(text) {
        if(!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const hasVN = /[àáảãạă]/.test(text);
        utterance.lang = hasVN ? 'vi-VN' : 'en-US';
        utterance.rate = 0.9;
        utterance.onstart = () => robotFace.classList.add('speaking');
        utterance.onend = () => {
            robotFace.classList.remove('speaking');
            isProcessing = false;
        };
        utterance.onerror = () => {
            robotFace.classList.remove('speaking');
            isProcessing = false;
        };
        window.speechSynthesis.speak(utterance);
    }

    function sendToAI(text) {
        if(!text.trim() || isProcessing) return;
        isProcessing = true;
        addMessage('user', text);
        robotFace.classList.add('thinking');
        statusDiv.innerText = "🤔 Đang suy nghĩ...";
        resetInactivityTimer();
        
        if(ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'user', text: text }));
        } else {
            addMessage('ai', "Mất kết nối, đang kết nối lại...");
            isProcessing = false;
            robotFace.classList.remove('thinking');
        }
    }

    function resetInactivityTimer() {
        if(inactivityTimer) clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(() => {
            if(!isProcessing) {
                statusDiv.innerText = "🎤 Đang lắng nghe... Hãy nói chuyện!";
                robotFace.classList.remove('thinking', 'speaking');
                
                // Trên iOS, hiển thị nút wake để người dùng kích hoạt lại nếu cần
                if(isIOS) {
                    iosWakeBtn.classList.add('show');
                }
            }
        }, INACTIVITY_LIMIT);
    }

    // Khởi tạo micro (nhấn nút)
    let isContinuousListening = false;
    
    function startContinuousListening() {
        if(isContinuousListening) return;
        if(!window.webkitSpeechRecognition && !window.SpeechRecognition) {
            statusDiv.innerText = "❌ Trình duyệt không hỗ trợ micro";
            return;
        }
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'vi-VN';
        
        recognition.onstart = () => {
            console.log("🎤 Continuous listening started");
            isContinuousListening = true;
            statusDiv.innerText = "🎤 CHIRI đang lắng nghe... Hãy nói!";
            robotFace.classList.add('listening');
            iosWakeBtn.classList.remove('show');
        };
        
        recognition.onresult = (event) => {
            for(let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript.toLowerCase().trim();
                if(transcript && event.results[i].isFinal) {
                    console.log("🎙️ Heard:", transcript);
                    
                    if(transcript.includes("chiri ơi") || transcript.includes("chiri oi") || 
                       transcript.includes("xin chào") || transcript.includes("hello chiri")) {
                        statusDiv.innerText = "🎤 Dạ, CHIRI nghe rõ!";
                        continue;
                    }
                    
                    if(transcript.length > 2 && !transcript.includes("chiri ơi")) {
                        recognition.stop();
                        sendToAI(transcript);
                        setTimeout(() => {
                            if(recognition) {
                                try { recognition.start(); } catch(e) { console.log(e); }
                            }
                        }, 2000);
                        break;
                    }
                }
            }
        };
        
        recognition.onerror = (event) => {
            console.error("Recognition error:", event.error);
            if(event.error === 'not-allowed') {
                statusDiv.innerText = "❌ Chưa cấp quyền micro!";
                startBtn.classList.remove('hidden');
            } else if(event.error === 'no-speech') {
                // Thường gặp trên iOS, thử khởi động lại
                setTimeout(() => {
                    if(recognition) {
                        try { recognition.start(); } catch(e) {}
                    }
                }, 500);
            }
        };
        
        recognition.onend = () => {
            console.log("Recognition ended");
            isContinuousListening = false;
            robotFace.classList.remove('listening');
            // Tự khởi động lại
            if(!isProcessing) {
                setTimeout(() => {
                    if(recognition) {
                        try { recognition.start(); } catch(e) {}
                    }
                }, 500);
            }
        };
        
        recognition.start();
    }

    async function initMicrophone() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStream = stream;
            console.log("✅ Microphone permission granted");
            statusDiv.innerText = "🎤 Đã có quyền micro! Đang khởi động...";
            
            startBtn.classList.add('hidden');
            startContinuousListening();
            connectWS();
            resetInactivityTimer();
            
            setTimeout(() => {
                const welcome = "Chào bạn! CHIRI đã sẵn sàng, hãy nói chuyện tự nhiên nhé!";
                addMessage('ai', welcome);
                speakText(welcome);
            }, 1000);
            
        } catch(err) {
            console.error("Micro error:", err);
            statusDiv.innerText = "❌ Không thể truy cập micro. Hãy kiểm tra quyền!";
            alert("Vui lòng cấp quyền micro để sử dụng CHIRI!");
        }
    }
    
    // iOS wake button - kích hoạt lại micro
    iosWakeBtn.addEventListener('click', () => {
        if(recognition) {
            try {
                recognition.stop();
                setTimeout(() => {
                    recognition.start();
                    statusDiv.innerText = "🎤 Đã kích hoạt lại! Hãy nói chuyện!";
                    iosWakeBtn.classList.remove('show');
                }, 500);
            } catch(e) {
                initMicrophone();
            }
        } else {
            initMicrophone();
        }
    });
    
    startBtn.addEventListener('click', initMicrophone);
    
    console.log("CHIRI ready - Platform:", isIOS ? "iOS" : "Android/Desktop");
</script>
</body>
</html>
