<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Robot AI</title>

<style>
body {
  font-family: Arial;
  background:#0f172a;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
}

#chat {
  width:90%;
  max-width:500px;
  height:70vh;
  overflow:auto;
  background:#111827;
  padding:10px;
  border-radius:10px;
}

.msg { margin:10px 0; }

.user { color:#60a5fa; }
.ai { color:#34d399; }

input {
  width:70%;
  padding:10px;
}

button {
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<h2>🤖 Robot AI</h2>

<div id="chat"></div>

<input id="text" placeholder="Nhập lệnh..."/>
<button onclick="send()">Gửi</button>
<button onclick="startVoice()">🎤 Voice</button>

<script>
const ws = new WebSocket(location.origin.replace("http","ws"));

ws.onopen = () => {
  ws.send(JSON.stringify({type:"user", text:"hello"}));
};

ws.onmessage = (e) => {
  const data = JSON.parse(e.data);

  const div = document.createElement("div");
  div.className = "msg ai";
  div.innerText = "AI: " + data.text;

  document.getElementById("chat").appendChild(div);
};

function send() {
  const t = document.getElementById("text").value;

  ws.send(JSON.stringify({
    type:"user",
    text:t
  }));

  const div = document.createElement("div");
  div.className="msg user";
  div.innerText="You: "+t;
  chat.appendChild(div);
}

// 🎤 VOICE CHAT
function startVoice() {
  const r = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  r.lang = "vi-VN";

  r.onresult = (e) => {
    const text = e.results[0][0].transcript;

    ws.send(JSON.stringify({
      type:"user",
      text
    }));
  };

  r.start();
}
</script>

</body>
</html>
