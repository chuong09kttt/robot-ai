<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pika AI - Robot học tiếng Anh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="robot-stage fullscreen-mode" id="robotStage">
            <canvas id="robotCanvas" width="400" height="400"></canvas>
            <div class="countdown" id="countdownTimer">⏱️ 60s</div>
        </div>
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">
                <button id="toggleChatBtn">🔽 Ẩn chat</button>
                <span class="status" id="statusText">🎤 Đang nghe...</span>
            </div>
            <div class="chat-box" id="chatBox"></div>
            <button id="microBtn" class="micro-btn">🎙️ Bật micro</button>
        </div>
    </div>
    <script src="face.js"></script>
    <script src="tts.js"></script>
    <script src="script.js"></script>
</body>
</html>
