<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🤖 Pika AI - Robot thông minh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app" id="app">
        <div class="robot-area" id="robotArea">
            <div class="robot-container">
                <div class="robot-face-wrapper">
                    <svg class="robot-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="100" cy="100" r="45" fill="#FFB347" stroke="#E67E22" stroke-width="3"/>
                        <circle cx="300" cy="100" r="45" fill="#FFB347" stroke="#E67E22" stroke-width="3"/>
                        <ellipse cx="200" cy="200" rx="130" ry="140" fill="#FFD699" stroke="#E67E22" stroke-width="4"/>
                        
                        <g id="leftEye">
                            <ellipse cx="145" cy="190" rx="28" ry="32" fill="white" stroke="#333" stroke-width="3"/>
                            <circle class="pupil" cx="150" cy="190" r="14" fill="#2C3E50"/>
                            <circle class="eye-glow" cx="146" cy="184" r="5" fill="white" opacity="0.9"/>
                        </g>
                        
                        <g id="rightEye">
                            <ellipse cx="255" cy="190" rx="28" ry="32" fill="white" stroke="#333" stroke-width="3"/>
                            <circle class="pupil" cx="260" cy="190" r="14" fill="#2C3E50"/>
                            <circle class="eye-glow" cx="256" cy="184" r="5" fill="white" opacity="0.9"/>
                        </g>
                        
                        <path id="leftEyebrow" d="M115 150 Q145 135 175 150" stroke="#5D4037" stroke-width="6" fill="none" stroke-linecap="round"/>
                        <path id="rightEyebrow" d="M225 150 Q255 135 285 150" stroke="#5D4037" stroke-width="6" fill="none" stroke-linecap="round"/>
                        
                        <ellipse cx="200" cy="230" rx="12" ry="8" fill="#E67E22"/>
                        
                        <path id="mouth" d="M160 270 Q200 310 240 270" stroke="#5D4037" stroke-width="5" fill="none" stroke-linecap="round"/>
                        
                        <ellipse cx="110" cy="240" rx="18" ry="12" fill="#FF9999" opacity="0.6"/>
                        <ellipse cx="290" cy="240" rx="18" ry="12" fill="#FF9999" opacity="0.6"/>
                    </svg>
                </div>
                
                <div class="robot-info">
                    <div class="robot-name">🤖 PIKA AI</div>
                    <div class="countdown-badge" id="countdownBadge">⏱️ 60s</div>
                </div>
            </div>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="chat-header">
                <button id="toggleChatBtn" class="toggle-btn">🔽 Ẩn chat</button>
                <div class="status" id="statusText">⚡ Nhấn nút tròn để bắt đầu</div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="msg-ai">
                    <span>🤖 Chào bạn! Hãy nhấn nút micro bên dưới và bắt đầu trò chuyện!</span>
                </div>
            </div>
            <button id="microBtn" class="micro-btn">🎙️ NHẤN ĐỂ NÓI</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
