<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🤖 AI Robot Pika - Học tiếng Anh cùng Robot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Robot Header */
        .robot-header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .robot-avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Mặt Robot */
        .robot-face {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .eyes {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .eye {
            width: 20px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .mouth {
            width: 40px;
            height: 20px;
            margin: 0 auto;
            border-radius: 0 0 20px 20px;
            transition: all 0.3s ease;
        }

        /* Cảm xúc khác nhau */
        .emotion-happy .mouth {
            background: #333;
            border-radius: 0 0 30px 30px;
            height: 25px;
        }

        .emotion-sad .mouth {
            background: #333;
            border-radius: 30px 30px 0 0;
            height: 25px;
        }

        .emotion-surprised .mouth {
            background: #333;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            margin-top: -5px;
        }

        .emotion-excited .eye {
            transform: scale(1.3);
            background: #ff6b6b;
        }

        .emotion-thinking .eye {
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .robot-name {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-top: 10px;
        }

        .robot-status {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        /* Trạng thái kết nối */
        .connection-status {
            text-align: center;
            padding: 8px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .connection-status.online {
            background: #d4edda;
            color: #155724;
        }

        .connection-status.offline {
            background: #f8d7da;
            color: #721c24;
        }

        /* Chat Box */
        .chat-box {
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 20px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 20px;
            position: relative;
        }

        .message.user .bubble {
            background: #667eea;
            color: white;
            border-radius: 20px 20px 5px 20px;
        }

        .message.ai .bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-radius: 20px 20px 20px 5px;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            margin-right: 10px;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        button {
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Quick Commands */
        .quick-commands {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-btn {
            padding: 8px 15px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            padding: 10px;
            margin-left: 45px;
        }

        .typing-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-10px); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Robot Header -->
        <div class="robot-header">
            <div class="robot-avatar" id="robotAvatar">
                <div class="robot-face" id="robotFace">
                    <div class="eyes">
                        <div class="eye" id="leftEye"></div>
                        <div class="eye" id="rightEye"></div>
                    </div>
                    <div class="mouth" id="robotMouth"></div>
                </div>
            </div>
            <div class="robot-name">🤖 Pika Robot</div>
            <div class="robot-status" id="robotStatus">Học tiếng Anh cùng Pika nào!</div>
        </div>

        <!-- Connection Status -->
        <div class="connection-status offline" id="connectionStatus">
            🔌 Đang kết nối...
        </div>

        <!-- Chat Box -->
        <div class="chat-box" id="chatBox">
            <div class="message ai">
                <div class="message-avatar">🤖</div>
                <div class="bubble">
                    Xin chào! Mình là Pika 🤖<br>
                    Mình sẽ giúp bạn học tiếng Anh qua trò chuyện!<br>
                    Hãy nói chuyện với mình nhé!
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Nhập tin nhắn của bạn..." />
            <button id="sendBtn">📤 Gửi</button>
        </div>

        <!-- Quick Commands -->
        <div class="quick-commands">
            <button class="quick-btn" data-text="Hello! How are you?">👋 Hello</button>
            <button class="quick-btn" data-text="What is your name?">📛 Name</button>
            <button class="quick-btn" data-text="I love learning English">❤️ Love</button>
            <button class="quick-btn" data-text="Can you help me?">🆘 Help</button>
            <button class="quick-btn" data-text="Thank you very much">🙏 Thanks</button>
            <button class="quick-btn" data-text="Goodbye! See you later">👋 Goodbye</button>
        </div>
    </div>

    <script>
        let ws = null;
        let currentEmotion = 'happy';

        // Các cảm xúc của robot
        const emotions = {
            happy: {
                eyeStyle: 'normal',
                mouthClass: 'emotion-happy',
                status: '😊 Mình đang rất vui!'
            },
            sad: {
                eyeStyle: 'normal',
                mouthClass: 'emotion-sad',
                status: '😔 Mình hơi buồn...'
            },
            surprised: {
                eyeStyle: 'big',
                mouthClass: 'emotion-surprised',
                status: '😲 Thật bất ngờ!'
            },
            excited: {
                eyeStyle: 'big',
                mouthClass: 'emotion-excited',
                status: '🤩 Wow! Thú vị quá!'
            },
            thinking: {
                eyeStyle: 'blink',
                mouthClass: 'normal',
                status: '🤔 Mình đang nghĩ...'
            }
        };

        function setEmotion(emotion) {
            currentEmotion = emotion;
            const robotFace = document.getElementById('robotFace');
            const robotStatus = document.getElementById('robotStatus');
            const leftEye = document.getElementById('leftEye');
            const rightEye = document.getElementById('rightEye');
            
            // Xóa các class cảm xúc cũ
            robotFace.className = 'robot-face';
            if (emotions[emotion]) {
                robotFace.classList.add(emotions[emotion].mouthClass);
                robotStatus.textContent = emotions[emotion].status;
                
                // Thay đổi mắt theo cảm xúc
                if (emotions[emotion].eyeStyle === 'big') {
                    leftEye.style.transform = 'scale(1.5)';
                    rightEye.style.transform = 'scale(1.5)';
                } else {
                    leftEye.style.transform = 'scale(1)';
                    rightEye.style.transform = 'scale(1)';
                }
                
                if (emotions[emotion].eyeStyle === 'blink') {
                    setInterval(() => {
                        leftEye.style.transform = 'scaleY(0.1)';
                        rightEye.style.transform = 'scaleY(0.1)';
                        setTimeout(() => {
                            leftEye.style.transform = 'scaleY(1)';
                            rightEye.style.transform = 'scaleY(1)';
                        }, 100);
                    }, 3000);
                }
            }
        }

        function showTyping() {
            document.getElementById('typingIndicator').style.display = 'block';
            setEmotion('thinking');
        }

        function hideTyping() {
            document.getElementById('typingIndicator').style.display = 'none';
        }

        function addMessage(type, text) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            if (type === 'ai') {
                messageDiv.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="bubble">${text}</div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="bubble">${text}</div>
                `;
            }
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // Phát âm thanh (tùy chọn)
            if (type === 'ai') {
                // Tạo hiệu ứng rung nhẹ cho avatar
                const avatar = document.querySelector('.robot-avatar');
                avatar.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    avatar.style.transform = 'scale(1)';
                }, 200);
            }
        }

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}`);
            
            ws.onopen = () => {
                const statusDiv = document.getElementById('connectionStatus');
                statusDiv.className = 'connection-status online';
                statusDiv.innerHTML = '✅ Đã kết nối - Pika đang sẵn sàng!';
                setEmotion('happy');
            };
            
            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'ai') {
                    hideTyping();
                    addMessage('ai', data.text);
                    
                    // Thay đổi cảm xúc dựa trên nội dung
                    if (data.text.includes('happy') || data.text.includes('vui') || data.text.includes(':)')) {
                        setEmotion('happy');
                    } else if (data.text.includes('sad') || data.text.includes('buồn')) {
                        setEmotion('sad');
                    } else if (data.text.includes('surprise') || data.text.includes('bất ngờ')) {
                        setEmotion('surprised');
                    } else if (data.text.includes('excited') || data.text.includes('thú vị')) {
                        setEmotion('excited');
                    } else {
                        setEmotion('happy');
                    }
                    
                    // Đọc văn bản (Text-to-Speech)
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(data.text);
                        utterance.lang = 'vi-VN';
                        utterance.rate = 0.9;
                        window.speechSynthesis.cancel();
                        window.speechSynthesis.speak(utterance);
                    }
                }
            };
            
            ws.onclose = () => {
                const statusDiv = document.getElementById('connectionStatus');
                statusDiv.className = 'connection-status offline';
                statusDiv.innerHTML = '❌ Mất kết nối - Đang thử lại...';
                setEmotion('sad');
                setTimeout(connect, 3000);
            };
        }
        
        async function sendMessage(text) {
            if (!text.trim() || !ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('ai', '❌ Xin lỗi, mình đang mất kết nối!');
                return;
            }
            
            addMessage('user', text);
            ws.send(JSON.stringify({ type: 'user', text: text }));
            showTyping();
            document.getElementById('messageInput').value = '';
        }
        
        // Event Listeners
        document.getElementById('sendBtn').addEventListener('click', () => {
            const input = document.getElementById('messageInput');
            sendMessage(input.value);
        });
        
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const input = document.getElementById('messageInput');
                sendMessage(input.value);
            }
        });
        
        // Quick command buttons
        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.getAttribute('data-text');
                sendMessage(text);
            });
        });
        
        // Khởi tạo kết nối
        connect();
        
        // Animation cho robot
        setInterval(() => {
            if (currentEmotion === 'happy') {
                const eyes = document.querySelectorAll('.eye');
                eyes.forEach(eye => {
                    eye.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
                });
                setTimeout(() => {
                    eyes.forEach(eye => {
                        eye.style.transform = 'translate(0, 0)';
                    });
                }, 200);
            }
        }, 3000);
    </script>
</body>
</html>
