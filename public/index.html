<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎙️ AI Robot Pika - Giao tiếp bằng giọng nói</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        /* Robot Header */
        .robot-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .robot-avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .robot-avatar:active {
            transform: scale(0.95);
        }

        .robot-face {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .eyes {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .eye {
            width: 20px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .mouth {
            width: 40px;
            height: 20px;
            margin: 0 auto;
            background: #333;
            border-radius: 0 0 20px 20px;
            transition: all 0.3s ease;
        }

        /* Cảm xúc */
        .listening .eye {
            background: #ff6b6b;
            animation: pulse 0.5s infinite;
        }

        .listening .mouth {
            width: 30px;
            height: 15px;
            border-radius: 50%;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .speaking .mouth {
            animation: talk 0.2s infinite;
        }

        @keyframes talk {
            0%, 100% { height: 10px; }
            50% { height: 25px; }
        }

        .robot-name {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .connection-status {
            text-align: center;
            padding: 8px;
            border-radius: 20px;
            margin: 15px 0;
            font-weight: bold;
            font-size: 14px;
        }

        .connection-status.online {
            background: #d4edda;
            color: #155724;
        }

        .connection-status.offline {
            background: #f8d7da;
            color: #721c24;
        }

        /* Microphone Button */
        .mic-button {
            width: 70px;
            height: 70px;
            margin: 10px auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .mic-button.listening {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            animation: shake 1s infinite;
            transform: scale(1.1);
        }

        @keyframes shake {
            0%, 100% { transform: scale(1.1); }
            25% { transform: scale(1.15); }
            75% { transform: scale(1.05); }
        }

        .mic-button svg {
            width: 35px;
            height: 35px;
            fill: white;
        }

        .mic-text {
            text-align: center;
            margin-top: 5px;
            font-size: 12px;
            color: #666;
        }

        /* Chat Box */
        .chat-box {
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            margin: 15px 0;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message .bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 20px;
            position: relative;
        }

        .message.user .bubble {
            background: #667eea;
            color: white;
            border-radius: 20px 20px 5px 20px;
        }

        .message.ai .bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-radius: 20px 20px 20px 5px;
        }

        .message-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            margin-right: 10px;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        /* Input Text */
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            margin-left: 45px;
        }

        .typing-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="robot-header">
            <div class="robot-avatar" id="robotAvatar">
                <div class="robot-face" id="robotFace">
                    <div class="eyes">
                        <div class="eye" id="leftEye"></div>
                        <div class="eye" id="rightEye"></div>
                    </div>
                    <div class="mouth" id="robotMouth"></div>
                </div>
            </div>
            <div class="robot-name">🎙️ Pika AI Robot</div>
        </div>

        <div class="connection-status offline" id="connectionStatus">
            🔌 Đang kết nối...
        </div>

        <!-- Microphone Button -->
        <div class="mic-button" id="micButton">
            <svg viewBox="0 0 24 24">
                <path d="M12 16c-2.21 0-4-1.79-4-4V6c0-2.21 1.79-4 4-4s4 1.79 4 4v6c0 2.21-1.79 4-4 4zm-6-4c0 .66.54 1.2 1.2 1.2h.6c.66 0 1.2-.54 1.2-1.2V6c0-.66-.54-1.2-1.2-1.2h-.6c-.66 0-1.2.54-1.2 1.2v6zm12 0c0 .66.54 1.2 1.2 1.2h.6c.66 0 1.2-.54 1.2-1.2V6c0-.66-.54-1.2-1.2-1.2h-.6c-.66 0-1.2.54-1.2 1.2v6z"/>
            </svg>
        </div>
        <div class="mic-text" id="micText">Nhấn và nói để giao tiếp</div>

        <div class="chat-box" id="chatBox">
            <div class="message ai">
                <div class="message-avatar">🤖</div>
                <div class="bubble">
                    Xin chào! Mình là Pika 🤖<br>
                    Hãy nhấn vào micro và nói chuyện với mình nhé!<br>
                    Mình sẽ trả lời bằng cả văn bản và giọng nói.
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Hoặc nhập văn bản..." />
            <button id="sendBtn">Gửi</button>
        </div>
    </div>

    <script>
        let ws = null;
        let recognition = null;
        let isListening = false;

        // Khởi tạo Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN'; // Tiếng Việt
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micButton').classList.add('listening');
                document.getElementById('micText').innerHTML = '🎙️ Đang nghe... Hãy nói!';
                document.getElementById('robotFace').classList.add('listening');
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('micText').innerHTML = `🗣️ "${text}"`;
                sendMessage(text);
                stopListening();
            };

            recognition.onerror = (event) => {
                console.error('Lỗi nhận dạng:', event.error);
                document.getElementById('micText').innerHTML = '❌ Không nghe rõ, thử lại!';
                stopListening();
            };

            recognition.onend = () => {
                stopListening();
            };
        } else {
            document.getElementById('micText').innerHTML = '⚠️ Trình duyệt không hỗ trợ micro';
            document.getElementById('micButton').style.opacity = '0.5';
        }

        function startListening() {
            if (recognition && !isListening) {
                try {
                    recognition.start();
                } catch (e) {
                    console.error('Lỗi:', e);
                }
            }
        }

        function stopListening() {
            isListening = false;
            document.getElementById('micButton').classList.remove('listening');
            document.getElementById('robotFace').classList.remove('listening');
            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {}
            }
        }

        // Text-to-Speech
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN';
                utterance.rate = 0.9;
                utterance.pitch = 1.2;
                utterance.onstart = () => {
                    document.getElementById('robotFace').classList.add('speaking');
                };
                utterance.onend = () => {
                    document.getElementById('robotFace').classList.remove('speaking');
                };
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        function showTyping() {
            document.getElementById('typingIndicator').style.display = 'block';
        }

        function hideTyping() {
            document.getElementById('typingIndicator').style.display = 'none';
        }

        function addMessage(type, text) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            if (type === 'ai') {
                messageDiv.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="bubble">${text}</div>
                `;
            } else {
                messageDiv.innerHTML = `<div class="bubble">${text}</div>`;
            }
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}`);
            
            ws.onopen = () => {
                const statusDiv = document.getElementById('connectionStatus');
                statusDiv.className = 'connection-status online';
                statusDiv.innerHTML = '✅ Đã kết nối - Sẵn sàng nghe bạn nói!';
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'ai') {
                    hideTyping();
                    addMessage('ai', data.text);
                    speak(data.text); // Đọc to câu trả lời
                }
            };
            
            ws.onclose = () => {
                const statusDiv = document.getElementById('connectionStatus');
                statusDiv.className = 'connection-status offline';
                statusDiv.innerHTML = '❌ Mất kết nối - Đang thử lại...';
                setTimeout(connect, 3000);
            };
        }
        
        function sendMessage(text) {
            if (!text.trim() || !ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('ai', '❌ Mất kết nối server!');
                return;
            }
            
            addMessage('user', text);
            ws.send(JSON.stringify({ type: 'user', text: text }));
            showTyping();
            document.getElementById('messageInput').value = '';
        }
        
        // Event Listeners
        document.getElementById('sendBtn').addEventListener('click', () => {
            const input = document.getElementById('messageInput');
            sendMessage(input.value);
        });
        
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage(e.target.value);
            }
        });
        
        document.getElementById('micButton').addEventListener('click', startListening);
        
        // Khởi tạo
        connect();
    </script>
</body>
</html>
