version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ESP32_PORT=/dev/ttyUSB0
    volumes:
      - /dev/ttyUSB0:/dev/ttyUSB0  # ESP32 serial port
    restart: unless-stopped
    networks:
      - robot-network

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://backend:3000/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - robot-network

  database:
    image: mongo:6
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASS}
    volumes:
      - mongodb_data:/data/db
    networks:
      - robot-network

networks:
  robot-network:
    driver: bridge

volumes:
  mongodb_data:
